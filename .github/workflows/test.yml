# Unit tests and lint; runs on every push and pull request.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # same as the image
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint Python
        run: pip install ruff==0.16.10 && ruff check app tests deploy
      - name: Lint shell scripts
        run: shellcheck --severity=warning docker/entrypoint.sh docker/build-ipxe.sh deploy/debian-vm/files/eve-netboot
      - name: user-data.yaml is up to date with deploy/debian-vm/files
        run: python deploy/debian-vm/build-user-data.py && git diff --exit-code deploy/debian-vm/user-data.yaml
