# Unit tests and lint; runs on every push and pull request.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # same as the image
      - name: Unit tests
        # PyYAML: the appliance reads #cloud-config user-data with it (python3-yaml in the VM)
        run: pip install pyyaml && python -m unittest discover -s tests -v
      - name: Lint Python
        run: pip install ruff==0.16.10 && ruff check app tests vm
      - name: Lint shell scripts
        run: >-
          shellcheck --severity=warning docker/entrypoint.sh docker/build-ipxe.sh
          vm/build/build.sh vm/build/provision.sh vm/rootfs/etc/profile.d/eve-netboot.sh
      - name: OVF descriptor is valid XML
        run: python -c "import xml.dom.minidom as m; m.parse('vm/build/eve-netboot.ovf.in')"
