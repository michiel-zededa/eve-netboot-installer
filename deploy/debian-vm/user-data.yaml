#cloud-config
# ===========================================================================
# EVE-Netboot-Installer Debian VM - cloud-init user data
#
# Use as the cloud-init / custom configuration of a Debian 12 or 13
# "genericcloud" VM. Before deploying, edit the three marked places:
#   1. the SSH key and/or the initial password of user "eve"
#   2. EVE_SOURCE (where the EVE-Netboot-Installer source is fetched from;
#      the default is the official repository)
#   3. any other setting in /etc/eve-netboot/settings.env below
# Everything else is generic. Progress: /var/log/eve-netboot.log
# ===========================================================================
hostname: eve-netboot
manage_etc_hosts: true
timezone: UTC

users:
  - name: eve
    gecos: EVE-Netboot-Installer admin
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: false
    # (1) replace with your own public key, or remove the two lines
    ssh_authorized_keys:
      - ssh-ed25519 AAAA-REPLACE-WITH-YOUR-PUBLIC-KEY you@example

# (1) initial password for console/SSH login; must be changed at first login
chpasswd:
  expire: true
  users:
    - name: eve
      password: ChangeMe-EVE-1
      type: text
ssh_pwauth: true

package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - nano

write_files:
  # (2)(3) settings - editable later with: sudo eve-netboot config
  - path: /etc/eve-netboot/settings.env
    permissions: "0600"
    content: |
      # ===========================================================================
      # EVE-Netboot-Installer Debian VM - settings
      #   On the VM: /etc/eve-netboot/settings.env   (edit with: sudo eve-netboot config)
      #   All options of the application are described in .env.example of the
      #   EVE-Netboot-Installer repository; the most common ones are listed here.
      # ===========================================================================

      # ---- where the application comes from ------------------------------------
      # git URL (cloned) or URL of a .tar.gz source archive
      EVE_SOURCE=https://github.com/michiel-zededa/eve-netboot-installer.git
      # branch or tag for git sources
      EVE_SOURCE_REF=main

      # ---- network ----------------------------------------------------------------
      # "auto" = the VM's own IPv4 address (re-detected at every boot).
      # Use a DHCP reservation or a fixed address so DHCP next-server stays valid.
      SERVER_IP=auto
      HTTP_PORT=8080

      # ---- application ------------------------------------------------------------
      EVE_LANGUAGE=en
      EVE_ARCHES=amd64
      EVE_FLAVOURS=kvm
      EVE_LTS_LINES=3
      EVE_MENU_TIMEOUT=300
      EVE_DEFAULT_SERIAL=none
      EVE_DEFAULT_INSTALL_SERVER=
      TZ=UTC

      # ---- your own installer ISOs ------------------------------------------------
      # Folder on the VM that is scanned for EVE installer ISOs
      IMPORT_DIR=/srv/eve-netboot/import
      EVE_IMPORT_LABEL=import share
      # Optional SMB share "eve-import" for that folder (yes/no)
      SMB_IMPORT_SHARE=no
      SMB_USER=eve
      SMB_PASSWORD=
  - path: /usr/local/sbin/eve-netboot
    permissions: "0755"
    content: |
      #!/bin/bash
      # ---------------------------------------------------------------------------
      # eve-netboot - manage the EVE-Netboot-Installer compose stack on this VM
      #
      #   eve-netboot install   first-time setup (run by cloud-init)
      #   eve-netboot start     (re)start the stack, re-detecting SERVER_IP if "auto"
      #   eve-netboot stop      stop the stack (data is kept)
      #   eve-netboot status    containers, IP, URLs, disk usage
      #   eve-netboot logs [service]   follow logs (sync | tftp | web)
      #   eve-netboot config    edit settings, then apply
      #   eve-netboot update    fetch the newest source and rebuild
      #   eve-netboot sync      check GitHub for new releases now
      #
      # Settings: /etc/eve-netboot/settings.env
      # Source:   /opt/eve-netboot          Data: /srv/eve-netboot
      # ---------------------------------------------------------------------------
      set -euo pipefail

      SETTINGS=/etc/eve-netboot/settings.env
      SRC=/opt/eve-netboot
      DATA=/srv/eve-netboot
      LOG=/var/log/eve-netboot.log

      msg()  { echo "[eve-netboot] $*" | tee -a "$LOG" >&2; }
      die()  { msg "ERROR: $*"; exit 1; }

      setting() {   # setting NAME [default]  -> value from settings.env
        local v
        v=$(sed -n "s/^$1=//p" "$SETTINGS" 2>/dev/null | tail -n1 | sed 's/^"\(.*\)"$/\1/')
        echo "${v:-${2:-}}"
      }

      primary_ip() {
        ip -4 route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}'
      }

      compose() { docker compose --project-directory "$SRC" -f "$SRC/compose.yaml" --env-file "$SRC/.env" "$@"; }

      install_docker() {
        if docker compose version >/dev/null 2>&1; then return; fi
        msg "installing Docker Engine + compose plugin"
        . /etc/os-release
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL "https://download.docker.com/linux/${ID}/gpg" -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/${ID} ${VERSION_CODENAME} stable" \
          > /etc/apt/sources.list.d/docker.list
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        systemctl enable --now docker
      }

      fetch_source() {
        local source ref
        source=$(setting EVE_SOURCE)
        ref=$(setting EVE_SOURCE_REF main)
        [ -n "$source" ] || die "EVE_SOURCE is not set in $SETTINGS"
        case "$source" in
          *.tar.gz|*.tgz)
            msg "downloading source archive $source"
            rm -rf "$SRC.new" && mkdir -p "$SRC.new"
            curl -fsSL "$source" | tar xz -C "$SRC.new" --strip-components=1
            [ -f "$SRC.new/compose.yaml" ] || die "archive does not contain compose.yaml"
            rm -rf "$SRC.old"; [ -d "$SRC" ] && mv "$SRC" "$SRC.old"; mv "$SRC.new" "$SRC"; rm -rf "$SRC.old"
            ;;
          *)
            if [ -d "$SRC/.git" ]; then
              msg "updating git checkout ($ref)"
              git -C "$SRC" fetch --quiet origin "$ref"
              git -C "$SRC" checkout --quiet -B "$ref" FETCH_HEAD
            else
              msg "cloning $source ($ref)"
              rm -rf "$SRC"
              git clone --quiet --branch "$ref" "$source" "$SRC"
            fi
            ;;
        esac
      }

      write_env() {
        # .env for compose = settings.env with VM specific values filled in
        local ip
        ip=$(setting SERVER_IP auto)
        if [ "$ip" = "auto" ]; then
          ip=$(primary_ip)
          [ -n "$ip" ] || die "could not determine this VM's IP address; set SERVER_IP in $SETTINGS"
        fi
        mkdir -p "$DATA/www" "$DATA/tftp"
        if [ ! -d "$(setting IMPORT_DIR "$DATA/import")" ]; then
          mkdir -p "$(setting IMPORT_DIR "$DATA/import")"
          # let the admin user copy ISOs in with scp
          id eve >/dev/null 2>&1 && chown eve: "$(setting IMPORT_DIR "$DATA/import")"
        fi
        {
          echo "# generated by eve-netboot from $SETTINGS - edit that file instead"
          grep -v -E '^(SERVER_IP|DATA_DIR|IMPORT_DIR|EVE_SRC_DIR|EVE_SOURCE|EVE_SOURCE_REF|SMB_[A-Z_]+)=' "$SETTINGS" || true
          echo "SERVER_IP=$ip"
          echo "DATA_DIR=$DATA"
          echo "IMPORT_DIR=$(setting IMPORT_DIR "$DATA/import")"
          echo "EVE_SRC_DIR=$SRC"
        } > "$SRC/.env"
        chmod 0600 "$SRC/.env"
        echo "$ip"
      }

      setup_smb() {
        [ "$(setting SMB_IMPORT_SHARE no)" = "yes" ] || return 0
        local user pass dir
        user=$(setting SMB_USER eve); pass=$(setting SMB_PASSWORD)
        dir=$(setting IMPORT_DIR "$DATA/import")
        [ -n "$pass" ] || die "SMB_IMPORT_SHARE=yes needs SMB_PASSWORD"
        msg "setting up SMB share 'eve-import' for $dir"
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq samba >/dev/null
        id "$user" >/dev/null 2>&1 || useradd -M -s /usr/sbin/nologin "$user"
        chown "$user" "$dir"
        grep -q '^\[eve-import\]' /etc/samba/smb.conf || cat >> /etc/samba/smb.conf <<CONF

      [eve-import]
         comment = EVE installer ISOs for EVE-Netboot-Installer
         path = $dir
         valid users = $user
         read only = no
         create mask = 0644
      CONF
        printf '%s\n%s\n' "$pass" "$pass" | smbpasswd -s -a "$user" >/dev/null
        systemctl restart smbd
      }

      cmd_install() {
        [ -f "$SETTINGS" ] || die "missing $SETTINGS"
        install_docker
        fetch_source
        setup_smb
        systemctl daemon-reload
        systemctl enable eve-netboot.service
        cmd_start
        msg "installation finished"
      }

      cmd_start() {
        local ip
        ip=$(write_env)
        msg "starting stack (SERVER_IP=$ip) - the first start builds the image (~5 min)"
        compose up -d --build --remove-orphans 2>&1 | tee -a "$LOG" >/dev/null
        msg "status page: http://$ip:$(setting HTTP_PORT 8080)/"
      }

      cmd_stop()   { compose down; }
      cmd_logs()   { compose logs -f --tail 100 ${1:+"$1"}; }
      cmd_sync()   { compose restart sync; msg "sync restarted - see: eve-netboot logs sync"; }
      cmd_update() { fetch_source; cmd_start; }
      cmd_config() {
        "${EDITOR:-nano}" "$SETTINGS"
        setup_smb
        cmd_start
      }
      cmd_status() {
        local ip port
        ip=$(sed -n 's/^SERVER_IP=//p' "$SRC/.env" 2>/dev/null); port=$(setting HTTP_PORT 8080)
        echo "VM address : $(primary_ip)   (SERVER_IP in use: ${ip:-?})"
        echo "Status page: http://${ip:-$(primary_ip)}:$port/"
        echo "DHCP       : next-server ${ip:-?}, boot file eve-x86_64.efi (x86_64 UEFI) or eve-arm64.efi (arm64 UEFI)"
        echo
        compose ps
        echo
        df -h "$DATA" | tail -n1 | awk '{print "Data disk  : " $3 " used, " $4 " free (" $5 ")"}'
      }

      # everything below needs root (docker, /etc, /srv)
      [ "$(id -u)" -eq 0 ] || exec sudo -- "$0" "$@"

      case "${1:-}" in
        install) shift; cmd_install "$@" ;;
        start)   shift; cmd_start "$@" ;;
        stop)    shift; cmd_stop "$@" ;;
        status)  shift; cmd_status "$@" ;;
        logs)    shift; cmd_logs "$@" ;;
        config)  shift; cmd_config "$@" ;;
        update)  shift; cmd_update "$@" ;;
        sync)    shift; cmd_sync "$@" ;;
        *) sed -n '3,14p' "$0" | sed 's/^# \{0,1\}//'; exit 1 ;;
      esac
  - path: /etc/systemd/system/eve-netboot.service
    permissions: "0644"
    content: |
      [Unit]
      Description=EVE-Netboot-Installer compose stack
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/eve-netboot start
      ExecStop=/usr/local/sbin/eve-netboot stop
      TimeoutStartSec=1800

      [Install]
      WantedBy=multi-user.target
  - path: /etc/motd
    permissions: "0644"
    content: |

      EVE-Netboot-Installer VM
        sudo eve-netboot status    containers, IP, status page URL
        sudo eve-netboot logs      follow the logs
        sudo eve-netboot config    change settings
        sudo eve-netboot update    newest version
      Manual: https://github.com/michiel-zededa/eve-netboot-installer/tree/main/deploy/debian-vm

runcmd:
  - [/usr/local/sbin/eve-netboot, install]

final_message: "EVE-Netboot-Installer VM ready after $UPTIME s - see /var/log/eve-netboot.log"
