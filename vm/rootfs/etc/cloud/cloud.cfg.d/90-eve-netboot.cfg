# EVE Netboot Installer appliance
# Where cloud-init may find user-data: NoCloud (cidata disk, e.g. ZEDEDA/EVE,
# Proxmox, libvirt), ConfigDrive (OpenStack-style), VMware guestinfo.
datasource_list: [NoCloud, ConfigDrive, VMware, None]
# the appliance manages network, host name and /etc/hosts itself
network: {config: disabled}
preserve_hostname: true
manage_etc_hosts: false
# "users", "password", "ssh_authorized_keys" in a #cloud-config apply to "admin"
system_info:
  default_user:
    name: admin
    lock_passwd: true
    gecos: EVE Netboot Installer admin
    groups: [adm, sudo]
    shell: /bin/bash
    # no "NOPASSWD:ALL" rule (Debian's default user has one): admin uses sudo
    # with its password; only the appliance menu runs without (sudoers.d/eve-netboot)
    sudo: false
